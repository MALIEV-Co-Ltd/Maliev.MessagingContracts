name: Validate Contracts

on:
  push:
    branches:
      - develop
  pull_request:
    paths:
      - 'contracts/**'
      - 'asyncapi/**'
      - 'topology/**'
      - 'generated/csharp/**'
      - 'tools/Generator/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Maliev.MessagingContracts.sln'
      - '.config/**'
      - '.github/dependabot.yml'
      - '.github/workflows/validate-contracts.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify validation scope
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.changed.outputs.runtime_changed }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE_REF" ]]; then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BASE_REF" --depth=1
          changed_files="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
          printf '%s\n' "$changed_files"
          if grep -Ev '^\.github/(dependabot\.yml|workflows/validate-contracts\.yaml)$' <<< "$changed_files" | grep -q .; then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "runtime_changed=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate schemas and generated contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Validate AsyncAPI and schemas
        run: npm test

      - name: Validate consumers
        run: ./scripts/validate-consumers.ps1
        shell: pwsh

      - name: Generate contracts
        run: ./scripts/build.ps1
        shell: pwsh

      - name: Validate bounded Dependabot policy
        shell: ruby {0}
        run: |
          require "yaml"
          path = ".github/dependabot.yml"
          bytes = File.binread(path)
          abort "UTF-8 BOM is not allowed" if bytes.start_with?("\xEF\xBB\xBF".b)
          config = YAML.safe_load(bytes, aliases: false)
          abort "Dependabot v2 is required" unless config["version"] == 2
          updates = config.fetch("updates")
          expected = { "github-actions" => 5, "nuget" => 10, "npm" => 10 }
          abort "Unexpected ecosystems" unless updates.map { |update| update["package-ecosystem"] }.sort == expected.keys.sort
          updates.each do |update|
            ecosystem = update.fetch("package-ecosystem")
            abort "Unexpected limit" unless update["open-pull-requests-limit"] == expected.fetch(ecosystem)
            abort "Weekly schedule required" unless update.dig("schedule", "interval") == "weekly"
            group = update.fetch("groups").values.fetch(0)
            abort "Only minor and patch may be grouped" unless group["update-types"].sort == ["minor", "patch"]
          end

  dotnet-pr-gate:
    name: Central .NET quality gate
    needs: scope
    if: needs.scope.outputs.runtime_changed == 'true'
    permissions:
      contents: read
    uses: MALIEV-Co-Ltd/Maliev.Workflows/.github/workflows/dotnet-pr-gate.yml@183ddf5d7b841aa3583f7961a21084d2f4e54b23
    with:
      target-path: Maliev.MessagingContracts.sln
      working-directory: .
      dotnet-version: 10.0.x
      configuration: Release
      coverage-threshold: 80
      artifact-retention-days: 7

  codeql-dotnet:
    name: Central CodeQL analysis
    needs: scope
    if: needs.scope.outputs.runtime_changed == 'true'
    permissions:
      contents: read
      security-events: write
    uses: MALIEV-Co-Ltd/Maliev.Workflows/.github/workflows/codeql-dotnet.yml@183ddf5d7b841aa3583f7961a21084d2f4e54b23
    with:
      target-path: Maliev.MessagingContracts.sln
      working-directory: .
      dotnet-version: 10.0.x

  required-summary:
    name: Required validation summary
    needs:
      - scope
      - validate
      - dotnet-pr-gate
      - codeql-dotnet
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce required validation results
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCHEMA_RESULT: ${{ needs.validate.result }}
          RUNTIME_CHANGED: ${{ needs.scope.outputs.runtime_changed }}
          DOTNET_RESULT: ${{ needs.dotnet-pr-gate.result }}
          CODEQL_RESULT: ${{ needs.codeql-dotnet.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = "success"
          test "$SCHEMA_RESULT" = "success"
          if [[ "$RUNTIME_CHANGED" == "true" ]]; then
            test "$DOTNET_RESULT" = "success"
            test "$CODEQL_RESULT" = "success"
          else
            test "$DOTNET_RESULT" = "skipped"
            test "$CODEQL_RESULT" = "skipped"
          fi
          echo "Required validation contract satisfied."
