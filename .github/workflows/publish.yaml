name: Publish NuGet Package

on:
  push:
    branches:
      - main
      - staging
      - develop
    paths:
      - 'contracts/schemas/**'
      - 'generated/csharp/**'
      - 'tools/Generator/**'
      - 'scripts/**'
      - '.github/workflows/publish.yaml'
      - 'package.json'
      - 'package-lock.json'
      - 'Maliev.MessagingContracts.slnx'
      - '.config/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.Config'
      - 'NuGet.config'
      - 'nuget.Config'
      - 'nuget.config'
  release:
    types: [published]
  workflow_dispatch: {}

env:
  PROJECT_PATH: 'generated/csharp/Maliev.MessagingContracts.csproj'

concurrency:
  group: publish-nuget-package
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.302'

      - name: Install dependencies
        run: npm ci

      - name: Validate AsyncAPI and schemas
        run: npm test

      - name: Restore .NET dependencies
        run: dotnet restore Maliev.MessagingContracts.slnx

      - name: Build .NET solution
        run: dotnet build Maliev.MessagingContracts.slnx --configuration Release --no-restore

      - name: Test .NET solution
        run: dotnet test Maliev.MessagingContracts.slnx --configuration Release --no-build --no-restore

      - name: Generate contracts
        run: ./scripts/build.ps1
        shell: pwsh

      - name: Verify generated C# is current
        run: node scripts/verify-generated-clean.cjs

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.302'

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="$(node scripts/resolve-package-version.cjs)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: >
          dotnet pack ${{ env.PROJECT_PATH }}
          --configuration Release
          --no-build
          -p:PackageVersion="$PACKAGE_VERSION"
          --output ./nupkg

      - name: Push to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --source "$NUGET_SOURCE"
          --api-key "$NUGET_AUTH_TOKEN"
          --skip-duplicate

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: ./nupkg/*.nupkg
          retention-days: 14
